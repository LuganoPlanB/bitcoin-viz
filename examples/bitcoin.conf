# Create /run/user/<your UID>/bitcoin-vis first, owned by the Core user, mode 0700.
# The helper tools/core.py uses a project-local directory instead.
signet=1
server=1
prune=550

[signet]
# Replace 1000 with your UID. Core translates unix: to libzmq ipc://.
zmqpubsequence=unix:/run/user/1000/bitcoin-vis/sequence.sock
# Cookie authentication and loopback RPC are the defaults. No rpcuser needed.
# Optional detailed protocol observations, with disk/I/O cost:
# capturemessages=1
