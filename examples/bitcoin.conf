# Create /run/user/<your UID>/bitcoin-viz first, owned by the Core user, mode 0700.
signet=1
server=1
prune=550

[signet]
# Replace 1000 with your UID. Core translates unix: to libzmq ipc://.
zmqpubsequence=unix:/run/user/1000/bitcoin-viz/sequence.sock
# Cookie authentication and loopback RPC are the defaults. No rpcuser needed.
# Optional detailed protocol observations, with disk/I/O cost:
# capturemessages=1
