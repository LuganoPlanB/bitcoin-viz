name: Bitcoin Viz release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitcoin-viz-release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.semver.outputs.next }}
      version: ${{ steps.semver.outputs.nextStrict }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Calculate semantic version
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: ${{ github.sha }}
          fallbackTag: v0.3.0
          skipInvalidTags: true
          tagFilter: '^v[0-9]+\.[0-9]+\.[0-9]+$'
          noNewCommitBehavior: current
          noVersionBumpBehavior: patch
      - name: Prepare exact versioned source candidate
        id: candidate
        env:
          RELEASE_VERSION: ${{ steps.semver.outputs.nextStrict }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          cmake -DVERSION="$RELEASE_VERSION" -DBASE="$SOURCE_COMMIT"
          -DBUNDLE=.release/release.bundle -P ci/release/prepare.cmake
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-source
          path: .release/release.bundle
          include-hidden-files: true
          retention-days: 7

  quality:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
          path: .release/source
      - name: Check out candidate
        env:
          CANDIDATE: ${{ needs.version.outputs.commit }}
        run: |
          git fetch .release/source/release.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git checkout --detach "$CANDIDATE"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libsqlite3-dev libzmq3-dev libcurl4-openssl-dev libssl-dev
      - name: Build and test release
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 2
          ctest --preset release
      - name: Build and test sanitizers
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake --preset sanitize -DCMAKE_CXX_COMPILER=clang++
          cmake --build --preset sanitize --parallel 2
          ctest --preset sanitize

  desktop:
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      candidate: ${{ needs.version.outputs.commit }}

  publish:
    needs: [version, quality, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
          path: .release/source
      - name: Check out tested source
        env:
          CANDIDATE: ${{ needs.version.outputs.commit }}
        run: |
          git fetch .release/source/release.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git checkout --detach "$CANDIDATE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: .release/assets
      - name: Verify complete release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          CANDIDATE: ${{ needs.version.outputs.commit }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cmake -DVERSION="$RELEASE_VERSION" -DCOMMIT="$CANDIDATE" -DDIRECTORY=.release/assets -P ci/release/collect.cmake
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$CANDIDATE"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$CANDIDATE" -m "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' >.release/draft 2>/dev/null; then
            if test "$(cat .release/draft)" = false; then
              echo "Release $RELEASE_TAG is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" .release/assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          git fetch origin main
          if test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"; then
            git push origin HEAD:refs/heads/main
          fi
