name: Native release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-main
  cancel-in-progress: false

env:
  VCPKG_COMMIT: 80aae04504a834399456d74605204bfe514762bf
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg
  VCPKG_BINARY_SOURCES: clear;default,readwrite

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.semver.outputs.next }}
      version: ${{ steps.semver.outputs.nextStrict }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Calculate semantic version
        id: semver
        uses: ietf-tools/semver-action@c90370b2958652d71c06a3484129a4d423a6d8a8 # v1.11.0
        with:
          token: ${{ github.token }}
          branch: ${{ github.sha }}
          fallbackTag: v0.2.0
          skipInvalidTags: true
          tagFilter: '^v[0-9]+\.[0-9]+\.[0-9]+$'
          noNewCommitBehavior: current
          noVersionBumpBehavior: patch
      - name: Prepare exact versioned source candidate
        id: candidate
        env:
          RELEASE_VERSION: ${{ steps.semver.outputs.nextStrict }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          python3 tools/release.py prepare --version "$RELEASE_VERSION"
          --base "$SOURCE_COMMIT" --bundle .release/release.bundle
          --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-source
          path: .release/release.bundle
          include-hidden-files: true
          retention-days: 7

  quality:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
          path: .release/source
      - name: Check out candidate
        env:
          CANDIDATE: ${{ needs.version.outputs.commit }}
        run: |
          git fetch .release/source/release.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git checkout --detach "$CANDIDATE"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libsqlite3-dev libzmq3-dev libcurl4-openssl-dev libssl-dev
      - name: Build and test release
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
        run: |
          cmake --preset release
          cmake --build --preset release --parallel 2
          ctest --preset release
      - name: Build and test sanitizers
        env:
          CCACHE_DIR: ${{ github.workspace }}/.cache/ccache
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake --preset sanitize -DCMAKE_CXX_COMPILER=clang++
          cmake --build --preset sanitize --parallel 2
          ctest --preset sanitize

  linux:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            musl: x86_64
            processor: x86_64
            triplet: x64-linux-musl
            emulator: ''
          - arch: arm64
            musl: arm_64
            processor: aarch64
            triplet: arm64-linux-musl
            emulator: qemu-aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
          path: .release/source
      - name: Check out candidate
        env:
          CANDIDATE: ${{ needs.version.outputs.commit }}
        run: |
          git fetch .release/source/release.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git checkout --detach "$CANDIDATE"
      - name: Set up Dyne musl toolchain
        id: musl
        uses: dyne/musl-action@fe1d1871b096824ddb7aa158f68dd63dabdc9586
        with:
          target_arch: ${{ matrix.musl }}
          version: v2.5.1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config ninja-build nasm perl qemu-user
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .tools/vcpkg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/vcpkg
          key: vcpkg-linux-${{ matrix.arch }}-dyne-2.5.1-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'ci/**') }}
      - name: Bootstrap dependency manager
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          .tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Build static musl binaries
        env:
          BWC_MUSL_CC: ${{ steps.musl.outputs.CC }}
          BWC_MUSL_CXX: ${{ steps.musl.outputs.CXX }}
          BWC_MUSL_PROCESSOR: ${{ matrix.processor }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          TRIPLET: ${{ matrix.triplet }}
          EMULATOR: ${{ matrix.emulator }}
        run: |
          cmake -S . -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.tools/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/ci/triplets" -DVCPKG_TARGET_TRIPLET="$TRIPLET" \
            -DCMAKE_CROSSCOMPILING_EMULATOR="$EMULATOR" -DBWC_VERSION="$RELEASE_VERSION"
          cmake --build build/package --parallel 2
          ctest --test-dir build/package -R '^native-contract$' --output-on-failure
          if readelf -l build/package/bitcoin-wizard-cave-native | grep -q INTERP; then
            echo 'Linux release executable must be fully static' >&2
            exit 1
          fi
          cmake --install build/package --prefix "$GITHUB_WORKSPACE/.release/stage"
      - name: Package
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          TARGET_ARCH: ${{ matrix.arch }}
          TRIPLET: ${{ matrix.triplet }}
        run: >-
          python3 tools/release.py package --version "$RELEASE_VERSION" --platform linux --arch "$TARGET_ARCH"
          --stage .release/stage --output .release/assets --dependencies "build/package/vcpkg_installed/$TRIPLET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: .release/assets/*
          include-hidden-files: true
          if-no-files-found: error

  desktop:
    needs: version
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: x86_64
            runner: macos-15-intel
            triplet: x64-osx-release
            osx_arch: x86_64
          - platform: macos
            arch: arm64
            runner: macos-15
            triplet: arm64-osx-release
            osx_arch: arm64
          - platform: windows
            arch: x86_64
            runner: windows-2022
            triplet: x64-windows-release
            osx_arch: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
          path: .release/source
      - name: Check out candidate
        env:
          CANDIDATE: ${{ needs.version.outputs.commit }}
        run: |
          git fetch .release/source/release.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git checkout --detach "$CANDIDATE"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install test publisher
        run: python -m pip install pyzmq==27.1.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .tools/vcpkg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache/vcpkg
          key: vcpkg-${{ matrix.runner }}-${{ matrix.arch }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'ci/**') }}
      - name: Create dependency cache directory
        run: python -c "import os,pathlib; pathlib.Path(os.environ['VCPKG_DEFAULT_BINARY_CACHE']).mkdir(parents=True,exist_ok=True)"
      - name: Bootstrap vcpkg on macOS
        if: runner.os != 'Windows'
        run: .tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.tools\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure macOS
        if: runner.os != 'Windows'
        env:
          TRIPLET: ${{ matrix.triplet }}
          TARGET_ARCH: ${{ matrix.osx_arch }}
        run: >-
          cmake -S . -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.tools/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/ci/triplets" -DVCPKG_TARGET_TRIPLET="$TRIPLET"
          -DCMAKE_OSX_ARCHITECTURES="$TARGET_ARCH" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Configure Windows
        if: runner.os == 'Windows'
        env:
          TRIPLET: ${{ matrix.triplet }}
        run: >-
          cmake -S . -B build/package -G 'Visual Studio 17 2022' -A x64
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/.tools/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/ci/triplets" -DVCPKG_TARGET_TRIPLET="$TRIPLET"
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build, test and install
        run: |
          cmake --build build/package --config Release --parallel 2
          ctest --test-dir build/package -C Release --output-on-failure
          cmake --install build/package --config Release --prefix "$GITHUB_WORKSPACE/.release/stage"
      - name: Package
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          TRIPLET: ${{ matrix.triplet }}
        run: >-
          python tools/release.py package --version "$RELEASE_VERSION" --platform "$TARGET_PLATFORM" --arch "$TARGET_ARCH"
          --stage .release/stage --output .release/assets --dependencies "build/package/vcpkg_installed/$TRIPLET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: .release/assets/*
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [version, quality, linux, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source
          path: .release/source
      - name: Check out tested source
        env:
          CANDIDATE: ${{ needs.version.outputs.commit }}
        run: |
          git fetch .release/source/release.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git checkout --detach "$CANDIDATE"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: .release/assets
      - name: Verify complete release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          CANDIDATE: ${{ needs.version.outputs.commit }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 tools/release.py collect --version "$RELEASE_VERSION" --commit "$CANDIDATE" --directory .release/assets
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$CANDIDATE"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$CANDIDATE" -m "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' >.release/draft 2>/dev/null; then
            if test "$(cat .release/draft)" = false; then
              echo "Release $RELEASE_TAG is already published; leaving its assets unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" .release/assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
          git fetch origin main
          if test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"; then
            git push origin HEAD:refs/heads/main
          fi
