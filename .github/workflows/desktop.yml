name: Bitcoin Viz desktop checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        description: Commit in the release-source bundle from the calling workflow
        required: true
        type: string

permissions:
  contents: read

env:
  VCPKG_COMMIT: 80aae04504a834399456d74605204bfe514762bf

jobs:
  native:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            preset: desktop
            platform: linux
            arch: x86_64
            core_archive: bitcoin-32.1-x86_64-linux-gnu.tar.gz
            core_sha256: 61545c17c3120fb7412f896d248b11993af04ec8817aad3649c55b2afb044963
          - runner: ubuntu-24.04-arm
            preset: desktop
            platform: linux
            arch: arm64
            core_archive: bitcoin-32.1-aarch64-linux-gnu.tar.gz
            core_sha256: 7ed37c7373eb6aa3e3f72842596a1afeba1b223717033cade9842b25773e1922
          - runner: macos-15
            preset: desktop-macos
            platform: macos
            arch: arm64
            triplet: arm64-osx-release
            core_archive: bitcoin-32.1-arm64-apple-darwin.tar.gz
            core_sha256: cd3dcdacb4ff861e862b2d7df4786ecef66472e2468dca1673a70dd761e064e7
          - runner: macos-15-intel
            preset: desktop-macos
            platform: macos
            arch: x86_64
            triplet: x64-osx-release
            core_archive: bitcoin-32.1-x86_64-apple-darwin.tar.gz
            core_sha256: 53b1e6ffd92843ca82ef4a737d7a53cb0a9fab15816a417a41f12fc954071447
          - runner: windows-2022
            preset: desktop-windows
            platform: windows
            arch: x86_64
            triplet: x64-windows-release
            core_archive: bitcoin-32.1-win64.zip
            core_sha256: b5b0c2cd007d69e96880907c79f9ae19ae82728f95fc8c923b4a07dab795b45d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.candidate != ''
        with:
          name: release-source
          path: .release/source
      - name: Check out versioned release candidate
        if: inputs.candidate != ''
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          git fetch .release/source/release.bundle HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$CANDIDATE"
          git checkout --detach "$CANDIDATE"
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libsqlite3-dev libzmq3-dev libcurl4-openssl-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libglew-dev libgl1-mesa-dev libglu1-mesa-dev libglm-dev \
            libpng-dev libfreetype-dev libboost-filesystem-dev libpcre2-dev libturbojpeg0-dev xvfb xauth xdotool ffmpeg
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: runner.os != 'Linux'
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_COMMIT }}
          path: .tools/vcpkg
      - name: Bootstrap macOS vcpkg
        if: runner.os == 'macOS'
        run: .tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Ensure FFmpeg test consumers
        if: runner.os != 'Linux'
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            if [[ "$RUNNER_OS" == macOS ]]; then brew install ffmpeg; else choco install ffmpeg --yes --no-progress; fi
          fi
      - name: Bootstrap Windows vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.tools\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          $destination = Join-Path $env:RUNNER_TEMP 'Inno Setup'
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer -TimeoutSec 120
          if ((Get-FileHash $installer).Hash -ne 'F3C42116542C4CC57263C5BA6C4FEABFC49FE771F2F98A79D2F7628B8762723B') {
            throw 'Inno Setup checksum mismatch'
          }
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList (
            '/PORTABLE=1 /CURRENTUSER /SP- /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="{0}"' -f $destination
          )
          if ($process.ExitCode -ne 0) { throw "Inno Setup exited $($process.ExitCode)" }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $destination
      - name: Extract pinned Bitcoin Core regtest fixture
        env:
          CORE_ARCHIVE: ${{ matrix.core_archive }}
          CORE_SHA256: ${{ matrix.core_sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/viz-core" "$RUNNER_TEMP/viz-evidence"
          cd "$RUNNER_TEMP/viz-core"
          curl --fail --silent --show-error --location --max-time 240 \
            --output "$CORE_ARCHIVE" "https://bitcoincore.org/bin/bitcoin-core-32.1/$CORE_ARCHIVE"
          python -c 'from hashlib import sha256; from pathlib import Path; import sys; sys.exit(sha256(Path(sys.argv[1]).read_bytes()).hexdigest() != sys.argv[2])' \
            "$CORE_ARCHIVE" "$CORE_SHA256"
          cmake -E tar xf "$CORE_ARCHIVE"
      - name: Build desktop and execute CTest
        env:
          PRESET: ${{ matrix.preset }}
          OSX_ARCH: ${{ matrix.arch }}
          TRIPLET: ${{ matrix.triplet }}
          VCPKG_ROOT: ${{ github.workspace }}/.tools/vcpkg
        run: |
          configure=(-DBITCOIN_VIZ_TEST_CORE_BIN_DIR="$RUNNER_TEMP/viz-core/bitcoin-32.1/bin")
          if [[ "$RUNNER_OS" == macOS ]]; then
            configure+=(-DCMAKE_OSX_ARCHITECTURES="$OSX_ARCH" -DVCPKG_TARGET_TRIPLET="$TRIPLET")
          fi
          cmake --preset "$PRESET" "${configure[@]}"
          cmake --build --preset "$PRESET" --parallel 2
          ctest --preset "$PRESET" --output-junit "$RUNNER_TEMP/viz-evidence/ctest.xml"
          if [[ "$RUNNER_OS" != Windows ]]; then
            cmake --install "build/$PRESET" --config Release --prefix "$RUNNER_TEMP/Desktop install"
          fi
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        run: |
          cmake --build --preset desktop-windows --target win-installer
          mkdir -p "$RUNNER_TEMP/viz-package"
          cp build/desktop-windows/installer/bitcoin-viz-v* "$RUNNER_TEMP/viz-package/"
      - name: Package the desktop viewer
        if: runner.os != 'Windows'
        env:
          PRESET: ${{ matrix.preset }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          TRIPLET: ${{ matrix.triplet }}
        run: |
          version=$(tr -d '\r\n' < VERSION)
          dependency_licenses=()
          if [[ -n "$TRIPLET" ]]; then
            dependency_licenses+=("-DDEPENDENCIES=build/$PRESET/vcpkg_installed/$TRIPLET")
          fi
          cmake -DVERSION="$version" -DPLATFORM="$TARGET_PLATFORM" -DARCH="$TARGET_ARCH" \
            -DSTAGE="$RUNNER_TEMP/Desktop install" -DOUTPUT="$RUNNER_TEMP/viz-package" \
            "${dependency_licenses[@]}" -P ci/release/package.cmake
      - name: Smoke-test the installed application
        run: |
          version=$(tr -d '\r\n' < VERSION)
          smoke=()
          if [[ "$RUNNER_OS" == Linux ]]; then smoke+=(--software-x11 --video-playback); fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            mesa_name=mesa3d-25.3.6-release-msvc.7z
            mesa_archive="$RUNNER_TEMP/$mesa_name"
            curl --fail --silent --show-error --location --max-time 180 --output "$mesa_archive" \
              "https://github.com/pal1000/mesa-dist-win/releases/download/25.3.6/$mesa_name"
            smoke+=(--windows-software-gl "$mesa_archive")
          fi
          archive=("$RUNNER_TEMP/viz-package"/bitcoin-viz-v*.tar.gz)
          if [[ "$RUNNER_OS" == Windows ]]; then
            archive=("$RUNNER_TEMP/viz-package"/bitcoin-viz-v*-setup.exe)
          fi
          python -B ci/desktop/installed.py "${archive[0]}" "$RUNNER_TEMP/viz-evidence" \
            --version "$version" --regtest-core-bin "$RUNNER_TEMP/viz-core/bitcoin-32.1/bin" "${smoke[@]}"
      - name: Exercise the Linux overlay via native input
        if: runner.os == 'Linux'
        run: |
          viewer="$RUNNER_TEMP/Desktop install/bin/bitcoin-viz-desktop"
          python -B tests/desktop_overlay.py "$viewer" "$RUNNER_TEMP/viz-evidence/overlay" --scale 100
          python -B tests/desktop_overlay.py "$viewer" "$RUNNER_TEMP/viz-evidence/startup" --scale 100 --startup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/viz-package/bitcoin-viz-v*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-${{ matrix.runner }}
          path: ${{ runner.temp }}/viz-evidence/
          if-no-files-found: warn
