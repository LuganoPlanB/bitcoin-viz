[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-wizard-cave"
version = "0.1.0"
description = "A durable Bitcoin Core observer with three live Gource projections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyzmq==27.1.0"]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.scripts]
bitcoin-wizard-cave = "bitcoin_wizard_cave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
